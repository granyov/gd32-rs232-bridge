name: Lazarus SoftW RS232 firmware
on:
  push:
    branches: [main, "docs/lazarus-softw-rs232", "feature/softw-rs232-config"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi python3 make
      - name: Verify source and host tests
        run: |
          make test
          make -j2 all verify
      - name: Package website firmware archives
        run: |
          python3 tools/package_website.py
          ls -lah dist
      - name: Upload two website-ready ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: Lazarus-SoftW-RS232-website-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
